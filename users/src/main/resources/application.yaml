spring:
  application:
    name: users-app

  # The security starter is added ahead of the explicit SecurityConfig (T2); keep the existing
  # unauthenticated API behavior until that chain is defined.
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration
      - org.springframework.boot.security.autoconfigure.actuate.web.servlet.ManagementWebSecurityAutoConfiguration
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30_000
      maximum-pool-size: 50
      minimum-idle: 10
      initialization-fail-timeout: 1
      leak-detection-threshold: 0
      register-mbeans: true
  liquibase:
    change-log: classpath:/migrations/changelog-master.xml
  data:
    web:
      pageable:
        one-indexed-parameters: true
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  lifecycle:
    timeout-per-shutdown-phase: 1m

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
  mvc:
    problemdetails:
      enabled: true

  security:
    oauth2:
      authorizationserver:
        issuer: ${AUTH_SERVER_ISSUER}
        jwk:
          file: ${AUTH_SERVER_JWK_FILE:_etc/jwk.json}
        client:
          id: ${AUTH_SERVER_CLIENT_ID:shortcut-chat}
          secret: ${AUTH_SERVER_CLIENT_SECRET}
          redirect-uri: ${AUTH_SERVER_CLIENT_REDIRECT_URI:http://127.0.0.1:8080/login/oauth2/code/shortcut}

server:
  shutdown: graceful

scheduler:
  default-lock:
    lock-at-least-for: PT1M
    lock-at-most-for: PT10M

tx-outbox:
  enabled: true
  channels:
    - name: user-lifecycle
      topic: UserLifecycle
    - name: mailer-commands
      topic: MailerCommands
  routes:
    - type: UserCreated
      channel: user-lifecycle
      event-name: UserCreated
    - type: UserUpdated
      channel: user-lifecycle
      event-name: UserUpdated
    - type: UserDeleted
      channel: user-lifecycle
      event-name: UserDeleted
    - type: SendCreatedUserNotification
      channel: mailer-commands
      event-name: SendEmail
    - type: SendOtpCode
      channel: mailer-commands
      event-name: SendEmail
  relay:
    batch-size: 100
    max-loops-per-run: 10
    schedule:
      mode: fixed-delay
      fixed-delay: PT5S
      initial-delay: PT1S
  lease:
    duration: PT30S
  retry:
    max-attempts: 10
    initial-delay: PT5S
    multiplier: 2
    max-delay: PT5M
  cleanup:
    enabled: true
    published-retention: P7D
    dead-retention: P30D
    schedule:
      mode: cron
      cron: "0 */30 * * * *"

management:
  endpoints:
    web:
      exposure:
        include: "*"
