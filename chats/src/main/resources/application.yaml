spring:
  application:
    name: chats-app

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30_000
      maximum-pool-size: 50
      minimum-idle: 10
      initialization-fail-timeout: 1
      leak-detection-threshold: 0
      register-mbeans: true
  liquibase:
    change-log: classpath:/migrations/changelog-master.xml
  data:
    web:
      pageable:
        one-indexed-parameters: true

  lifecycle:
    timeout-per-shutdown-phase: 1m

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: chats-app
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful

scheduler:
  default-lock:
    lock-at-least-for: PT1M
    lock-at-most-for: PT10M

tx-outbox:
  enabled: true
  channels:
    - name: chat-lifecycle
      topic: ChatLifecycle
  routes:
    - type: ChatCreated
      channel: chat-lifecycle
      event-name: ChatCreated
  relay:
    batch-size: 100
    max-loops-per-run: 10
    schedule:
      mode: fixed-delay
      fixed-delay: PT5S
      initial-delay: PT1S
  lease:
    duration: PT30S
  retry:
    max-attempts: 10
    initial-delay: PT5S
    multiplier: 2
    max-delay: PT5M
  cleanup:
    enabled: true
    published-retention: P7D
    dead-retention: P30D
    schedule:
      mode: cron
      cron: "0 */30 * * * *"

management:
  endpoints:
    web:
      exposure:
        include: "*"
