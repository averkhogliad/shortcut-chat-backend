spring:
  application:
    name: notifications-app

  lifecycle:
    timeout-per-shutdown-phase: 10s

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notifications-app
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
#      properties:
#        'spring.json.use.type.headers' : false
#      auto-offset-reset: latest
#      enable-auto-commit: false

  mvc:
    problemdetails:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVER_ISSUER}
      client:
        registration:
          users-service:
            provider: users
            client-id: ${NOTIFICATIONS_SERVICE_CLIENT_ID}
            client-secret: ${NOTIFICATIONS_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
        provider:
          users:
            token-uri: ${AUTH_SERVER_ISSUER}/oauth2/token

server:
  shutdown: graceful

notifications:
  window-duration: 1m

integrations:
  chat-service:
    base-url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: "*"
