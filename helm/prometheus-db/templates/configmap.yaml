apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prometheus-db.fullname" . }}
  labels:
    {{- include "prometheus-db.labels" . | nindent 4 }}

data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.global.scrapeInterval }}
      scrape_timeout: {{ .Values.global.scrapeTimeout }}
      evaluation_interval: {{ .Values.global.evaluationInterval }}

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
{{- if .Values.scrapeConfigs }}
{{ .Values.scrapeConfigs | toYaml | indent 6 }}
{{- end }}